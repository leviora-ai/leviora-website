# Security headers for every response of the static site. nginx drops inherited add_header
# directives in any location that sets its own, so each location of nginx.conf includes this file
# (the Dockerfile copies it to /etc/nginx/snippets/). HSTS is set by the TLS terminator
# (ingress-nginx), not here.
#
# CSP: everything from this origin; no inline scripts (astro.config.mjs never inlines them and
# BaseLayout loads /js-flag.js); inline styles stay allowed (Astro inlines small stylesheets and
# components use style attributes).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
