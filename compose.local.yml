# Local full-stack preview: docker compose -f compose.local.yml up -d
# Site: http://localhost:8088  (form → api container üzerinden çalışır)
# Gerçek mail göndermek için: RESEND_API_KEY=re_... docker compose -f compose.local.yml up -d
services:
  web:
    image: leviora-website:local
    ports:
      - "8088:8080"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    image: leviora-website-api:local
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO: ${CONTACT_TO:-info@leviora.ai}
