# Standalone ArgoCD Application — separate pipeline from pandora-* platform stack.
#
# One-time bootstrap (against the Hetzner cluster kubeconfig):
#   kubectl apply -f k8s/argocd-application.yaml
#
# After that, every push to main triggers GHA build → GHCR `:latest` (+ `:sha-<7>`).
# Because `imagePullPolicy: Always` is set on the Deployment and the image tag is
# pinned to `:latest`, the pod re-pulls the new image at the next pod restart.
# ArgoCD auto-sync handles repo manifest drift; for image-only updates run:
#   argocd app sync leviora-website
#   # or
#   kubectl rollout restart deploy/leviora-website -n leviora-website
#
# (argocd-image-updater is NOT installed on the Hetzner cluster — once it is,
#  swap to digest-based annotations here.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: leviora-website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/leviora-ai/leviora-website
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: leviora-website
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ⛔ SONSUZ OutOfSync DÖNGÜSÜ — ölçüldü (01.09.2026, canlı prod).
      # Bu bayrak OLMADAN ArgoCD, git'i API sunucusunun DOLDURDUĞU CRD
      # varsayılanlarıyla karşılaştırıyor ve farkı SAPMA sanıyor. Ölçülen
      # sahte fark (ExternalSecret/leviora-api-secrets):
      #   spec.data[].remoteRef.conversionStrategy = "Default"
      #   spec.data[].remoteRef.decodingStrategy   = "None"
      #   spec.target.deletionPolicy               = "Retain"
      # Üçü de git'te YAZMIYOR çünkü YAZILMAMALI — CRD'nin kendi
      # varsayılanları. `automated.selfHeal` açık olduğu için app sürekli
      # senkronlayıp sürekli tekrar OutOfSync'e düşüyordu: app aylardır
      # "OutOfSync / Healthy" görünüyor ve gerçek bir sapma doğduğunda
      # kimse fark etmeyecekti — gürültü, bekçiyi kör ediyor.
      # ServerSideDiff, karşılaştırmayı API sunucusunun kuru-koşumu üzerinden
      # yaptırır ⇒ varsayılanlar iki tarafta da dolu olur, fark kalmaz.
      # Emsal: pandora-prod app'i bu bayrağı taşıyor ve bu sorunu yaşamıyor.
      - ServerSideDiff=true
