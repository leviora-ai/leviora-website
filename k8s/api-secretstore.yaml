# Vault SecretStore for the leviora-website namespace. Mirrors the
# argocd-ns `vault-prod` SecretStore pattern (pandora-infra/argocd/
# secret-store-vault.yaml). Vault side (created 2026-07-23 via UI):
#   policy  leviora-website-eso-prod  → read secret/data|metadata/pandora/prod/email
#   role    auth/kubernetes/role/leviora-website-eso-prod
#           bound_service_account_names=external-secrets-sa
#           bound_service_account_namespaces=leviora-website
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-prod
  namespace: leviora-website
  labels:
    app.kubernetes.io/name: leviora-website-api
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: leviora-website-eso-prod
          serviceAccountRef:
            name: external-secrets-sa
