# Pulls RESEND_API_KEY from Vault (pandora/prod/email — same key the IAM
# email backend uses) into the leviora-api-secrets Secret consumed by the
# contact API Deployment. No secret material ever lives in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: leviora-api-secrets
  namespace: leviora-website
  labels:
    app.kubernetes.io/name: leviora-website-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-prod
    kind: SecretStore
  target:
    name: leviora-api-secrets
    # Orphan (pandora-infra runbook simplification-2026-10-aselsan-vault.md, step 9.0b):
    # Vault and ESO leave the cluster. With Owner, deleting this ExternalSecret (or the
    # ESO CRDs) garbage-collects the Secret and leviora-website-api stops starting. On the
    # next successful reconcile ESO removes its ownerReference; the Secret stays, with the
    # same value. The ExternalSecret itself goes in the follow-up change.
    creationPolicy: Orphan
  data:
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: pandora/prod/email
        property: RESEND_API_KEY
