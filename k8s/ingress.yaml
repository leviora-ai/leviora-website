apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leviora-website
  namespace: leviora-website
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - leviora.ai
        - www.leviora.ai
      secretName: leviora-website-tls
  rules:
    - host: leviora.ai
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: leviora-website-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: leviora-website
                port:
                  name: http
---
# www → apex permanent redirect (cert-manager still issues the cert for www
# because it's in the TLS hosts list above; this ingress only handles the
# 308 redirect to canonical apex).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leviora-website-www-redirect
  namespace: leviora-website
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: https://leviora.ai$request_uri
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.leviora.ai
      secretName: leviora-website-tls
  rules:
    - host: www.leviora.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: leviora-website
                port:
                  name: http
