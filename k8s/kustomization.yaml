apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: leviora-website
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# Immutable image references. The build workflow (.github/workflows/build.yml, job `pin`) rewrites
# newTag + digest after every main build with yq, which keeps this file's layout; do not
# hand-edit them except to roll back (set both to an earlier sha- tag and its digest).
images:
  - name: ghcr.io/leviora-ai/leviora-website
    newTag: sha-c131ad3
    digest: sha256:5a5b2babb6f3469537b4d53295ae9218d87fa8ba221c1552f1cd6f5935161507
  - name: ghcr.io/leviora-ai/leviora-website-api
    newTag: sha-c131ad3
    digest: sha256:013b569a028ba6ab3dea2e508ada6ddd9ad0208e651b9e90e6e63d3a727f07fd
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: leviora-marketing
      app.kubernetes.io/managed-by: kustomize
