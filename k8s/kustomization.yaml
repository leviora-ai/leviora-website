apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: leviora-website
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# Immutable image references. The build workflow (.github/workflows/build.yml, job `pin`) rewrites
# newTag + digest after every main build with yq, which keeps this file's layout; do not
# hand-edit them except to roll back (set both to an earlier sha- tag and its digest).
images:
  - name: ghcr.io/leviora-ai/leviora-website
    newTag: sha-a149540
    digest: sha256:2f81f58f8ea7409ae7e61250f283aeac29dc32d7dd627c99f98ad4cb3faba8f1
  - name: ghcr.io/leviora-ai/leviora-website-api
    newTag: sha-a149540
    digest: sha256:53f5430e19e4ae6c0caf77968bf413c20a6821f7073c00e3ef23e9941d7a7214
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: leviora-marketing
      app.kubernetes.io/managed-by: kustomize
