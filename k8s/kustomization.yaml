apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: leviora-website

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - certificate.yaml
  - ingress.yaml

images:
  - name: ghcr.io/leviora-ai/leviora-website
    newTag: latest

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: leviora-marketing
      app.kubernetes.io/managed-by: kustomize
