apiVersion: apps/v1
kind: Deployment
metadata:
  name: leviora-website-api
  namespace: leviora-website
  labels:
    app.kubernetes.io/name: leviora-website-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: leviora-website-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: leviora-website-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/leviora-ai/leviora-website-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CONTACT_TO
              value: info@leviora.ai
            - name: CONTACT_FROM
              value: Leviora <noreply@leviora.ai>
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: leviora-api-secrets
                  key: RESEND_API_KEY
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
